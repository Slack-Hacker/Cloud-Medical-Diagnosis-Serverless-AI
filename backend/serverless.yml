service: cloud-medical-diagnosis-faas

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  stage: dev
  region: us-east-1
  memorySize: 1024
  timeout: 20
  environment:
    STAGE: ${self:provider.stage}

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: any
          cors: true
      - http:
          path: /{proxy+}
          method: any
          cors: true

plugins:
  - serverless-wsgi
  - serverless-python-requirements

custom:
  wsgi:
    app: app.app
    packRequirements: false
