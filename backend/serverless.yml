service: faas-medical-summarizer

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 15
  environment:
    STAGE: ${self:provider.stage}

functions:
  summarizeReport:
    handler: handler.lambda_handler
    events:
      - http:
          path: /api/v1/summarize
          method: post
          cors: true

plugins:
  - serverless-python-requirements
